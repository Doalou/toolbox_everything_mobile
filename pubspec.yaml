name: toolbox_everything_mobile
description: "Toolbox Everything Mobile - Pleins d'outils en un seul app"
publish_to: 'none'

version: 0.5.1+13

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  flutter_compass: ^0.8.1
  file_picker: ^13.3.2
  yaml: ^3.1.4
  youtube_explode_dart: ^3.1.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  sensors_plus: ^7.1.1
  provider: ^6.1.5
  collection: ^1.19.1
  flutter_colorpicker: ^1.1.0
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.3
  # pdf 3.13+/printing 5.15+ require xml 7, currently incompatible with
  # youtube_explode_dart (xml 6).
  pdf: ^3.12.0
  printing: ^5.14.3
  open_file: ^4.0.0
  http: ^1.6.0
  connectivity_plus: ^7.3.2
  pasteboard: ^0.6.0
  ffmpeg_kit_flutter_new: ^4.6.8
  # dynamic_color 2.x bascule sur le paquet expérimental material_ui au lieu de flutter/material.dart.
  dynamic_color: ^1.9.0
  quick_actions: ^1.1.1

dependency_overrides:
  # image 4.11.0 appelle ZLibDecoder().decodeLazy(), introduit dans archive >= 4.1.0.
  archive: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#1E1E1E"
  color_dark: "#1E1E1E"
  image: "lib/assets/images/Toolbox Everything Splash Logo.png"
  branding: "lib/assets/images/Toolbox Everything Branding.png"
  branding_mode: bottom

  android_12:
    color: "#1E1E1E"
    color_dark: "#1E1E1E"
    image: "lib/assets/images/Toolbox Everything Splash Logo.png"
    branding: "lib/assets/images/Toolbox Everything Branding.png"
    branding_mode: bottom

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/images/Toolbox Everything Logo.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#1E1E1E"
  adaptive_icon_foreground: "lib/assets/images/Toolbox Everything Logo Transparent.png"
  adaptive_icon_padding: true

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/

  fonts:
    - family: Fraunces
      fonts:
        - asset: lib/assets/fonts/Fraunces-Variable.ttf
        - asset: lib/assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic
